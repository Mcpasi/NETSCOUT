name: Android tests & debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-debug:
    name: Unit tests, lint & signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/netscout-models
          key: relevance-model-${{ hashFiles('relevance-model.lock.json') }}
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run tests, lint and build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: >-
          ./gradlew :core:search:test :data:search:test :data:relevance:test :app:testDebugUnitTest
          :app:lintDebug :app:assembleDebug
          -Pnetscout.versionCode=$((1000 + BUILD_NUMBER)) --stacktrace
      - name: Verify permanent debug certificate
        run: python3 scripts/verify-debug-signature.py app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare APK download
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/netscout-debug.apk
          cp debug-signing/certificate.sha256 artifacts/signing-certificate.sha256
          cd artifacts
          sha256sum netscout-debug.apk > netscout-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: netscout-debug-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-and-lint
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-debug.*
          retention-days: 14

  ui-tests:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/netscout-models
          key: relevance-model-${{ hashFiles('relevance-model.lock.json') }}
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          # Keep the AVD below the free disk space on hosted runners.
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          script: bash scripts/run-device-tests.sh
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/ui-screenshots/
          retention-days: 14
