name: Android tests & APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fdroid-release:
    name: F-Droid source scan & unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK and F-Droid tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python3 -m pip install 'fdroidserver==2.4.5'
      - name: Verify pinned Horizon Small and offline model preparation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build using the F-Droid recipe
        run: python3 scripts/check-fdroid-build.py --work-dir "$RUNNER_TEMP/netscout-fdroid"
      - name: Verify unsigned release contents and version
        run: python3 scripts/verify-release-apk.py "$RUNNER_TEMP/netscout-fdroid/unsigned/netscout-release-unsigned.apk"
      - name: Prepare release download
        run: |
          mkdir -p release-artifacts
          cp "$RUNNER_TEMP/netscout-fdroid/unsigned/netscout-release-unsigned.apk" release-artifacts/netscout-release-unsigned.apk
          cd release-artifacts
          sha256sum netscout-release-unsigned.apk > netscout-release-unsigned.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: netscout-fdroid-release-${{ github.run_number }}
          path: release-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Upload F-Droid build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-build-logs
          path: ${{ runner.temp }}/netscout-fdroid/logs/
          retention-days: 14

  verify-and-debug:
    name: Unit tests, lint & signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/netscout-models
          key: relevance-model-${{ hashFiles('relevance-model.lock.json') }}
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify model preparation contracts
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run tests, lint and build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: >-
          ./gradlew :core:search:test :data:search:test :data:relevance:test :app:testDebugUnitTest
          :app:lintDebug :app:assembleDebug
          -Pnetscout.versionCode=$((1000 + BUILD_NUMBER)) --stacktrace
      - name: Verify permanent debug certificate
        run: python3 scripts/verify-debug-signature.py app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare APK download
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/netscout-debug.apk
          cp debug-signing/certificate.sha256 artifacts/signing-certificate.sha256
          cd artifacts
          sha256sum netscout-debug.apk > netscout-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: netscout-debug-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-and-lint
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-debug.*
          retention-days: 14

  ui-tests:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for emulator userdata
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/netscout-models
          key: relevance-model-${{ hashFiles('relevance-model.lock.json') }}
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-boot-timeout: 180
          disable-animations: true
          script: bash scripts/run-device-tests.sh
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/ui-screenshots/
          retention-days: 14
